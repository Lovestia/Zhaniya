<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Love Galaxy 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff4fc3;--violet:#8a5cff}
*{box-sizing:border-box}
html,body{margin:0;overscroll-behavior:none;height:100%;overflow:hidden;background:#05010d;font-family:'Nunito',Arial,sans-serif;touch-action:none;user-select:none}
canvas{display:block;touch-action:none;position:fixed;inset:0;width:100%!important;height:100%!important}
#start{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px;z-index:100;text-align:center;padding:20px;
 background:radial-gradient(ellipse at 50% 40%,rgba(255,79,195,.55),rgba(138,92,255,.25) 40%,#05010d 75%);transition:opacity 1.2s ease,visibility 1.2s}
#start.hide{opacity:0;visibility:hidden}
#start h1{margin:0;font-family:'Pacifico',cursive,Arial;font-weight:400;font-size:clamp(40px,9vw,92px);color:#fff;
 text-shadow:0 0 12px #fff,0 0 30px var(--pink),0 0 70px var(--pink);animation:float 4s ease-in-out infinite}
#start p{margin:0;color:#ffd6f1;opacity:.85;font-size:clamp(14px,2.5vw,18px);letter-spacing:.08em}
#start button{position:relative;padding:18px 46px;font:700 clamp(17px,3vw,22px) 'Nunito',Arial;color:#fff;cursor:pointer;
 border:1px solid rgba(255,255,255,.45);border-radius:40px;background:linear-gradient(135deg,#ff4fc3,#8a5cff);
 box-shadow:0 0 30px rgba(255,79,195,.7),inset 0 0 18px rgba(255,255,255,.25);animation:pulse 2s ease-in-out infinite;transition:transform .2s}
#start button:hover{transform:scale(1.07)}
.heart-float{position:absolute;bottom:-40px;font-size:24px;opacity:.8;animation:rise linear forwards;pointer-events:none}
#hint{position:fixed;left:0;right:0;bottom:100px;text-align:center;color:#ffe3f6;font-size:15px;letter-spacing:.05em;
 text-shadow:0 0 12px var(--pink);z-index:5;opacity:0;transition:opacity 1.5s;pointer-events:none}
#hint.show{opacity:.9}
#zoom{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:18px;z-index:6;opacity:0;visibility:hidden;transition:opacity .4s}
#zoom.show{opacity:.4;visibility:visible}
#zoom.show:hover,#zoom.show:active{opacity:.85}
#zoom button{width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.3);color:#fff;font:700 28px/1 'Nunito',Arial;cursor:pointer;
 background:rgba(255,255,255,.08);box-shadow:none;
 display:flex;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent}
#zoom button:active{transform:scale(.92)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,rgba(5,1,13,.75))}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes pulse{50%{box-shadow:0 0 55px rgba(255,79,195,1),inset 0 0 18px rgba(255,255,255,.35);transform:scale(1.04)}}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<div id="vig"></div>
<div id="hint">Вращай и маштабируй кнопки + | — приблизить и отдалить</div>
<div id="start">
  <h1>Love Galaxy</h1>
  <p>маленькая галактика, созданная с любовью</p>
  <button onclick="startGalaxy()">💖 Открыть галактику 💖</button>
</div>
<div id="zoom"><button id="zoomOut" aria-label="Отдалить">−</button><button id="zoomIn" aria-label="Приблизить">+</button></div>
<audio id="music" loop src="song.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="photos.js"></script>
<script>
// ---------- фон стартового экрана: всплывающие сердечки ----------
const startEl=document.getElementById('start');
const riseTimer=setInterval(()=>{
  const h=document.createElement('div');
  h.className='heart-float';
  h.textContent=['💖','💕','💗','✨','🌸'][Math.random()*5|0];
  h.style.left=Math.random()*100+'vw';
  h.style.fontSize=(16+Math.random()*28)+'px';
  h.style.animationDuration=(5+Math.random()*5)+'s';
  startEl.appendChild(h);
  setTimeout(()=>h.remove(),10000);
},350);

// ---------- сцена ----------
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x05010d,0.00018);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,6000);
camera.position.set(0,250,2400);

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0x05010d);
renderer.domElement.style.opacity='0';renderer.domElement.style.transition='opacity 2.2s ease .4s';
document.body.appendChild(renderer.domElement);

const galaxy=new THREE.Group();
galaxy.rotation.x=0.35;
scene.add(galaxy);

// мягкая круглая текстура частицы
function glowTexture(){
  const c=document.createElement('canvas');c.width=c.height=64;
  const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(.25,'rgba(255,255,255,.7)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const glow=glowTexture();

function points(positions,colors,size,opacity=1){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));
  return new THREE.Points(g,new THREE.PointsMaterial({
    size,map:glow,vertexColors:true,transparent:true,opacity,
    blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true
  }));
}

// ---------- спиральная галактика ----------
const ARMS=4,N=45000,R=1500;
const gp=[],gc=[];
const cIn=new THREE.Color(0xfff0fb),cMid=new THREE.Color(0xff4fc3),cOut=new THREE.Color(0x6a5cff);
for(let i=0;i<N;i++){
  const r=Math.pow(Math.random(),1.6)*R+190;
  const arm=(i%ARMS)/ARMS*Math.PI*2;
  const spin=r*0.0042;
  const spread=Math.pow(Math.random(),2)*(40+r*0.22);
  const a=arm+spin+(Math.random()-.5)*spread/(r*.25+30);
  const x=Math.cos(a)*r+(Math.random()-.5)*spread;
  const z=Math.sin(a)*r+(Math.random()-.5)*spread;
  const y=(Math.random()-.5)*Math.max(10,170-r*.1)*Math.random();
  gp.push(x,y,z);
  const t=r/R;
  const col=t<.35?cIn.clone().lerp(cMid,t/.35):cMid.clone().lerp(cOut,(t-.35)/.65);
  col.multiplyScalar(.55+Math.random()*.6);
  gc.push(col.r,col.g,col.b);
}
const disk=points(gp,gc,7,.9);
galaxy.add(disk);

// туманности
const nebula=new THREE.Group();
const nebCols=[0xff2ea6,0x8a5cff,0xff7ad9,0x4a6bff];
for(let i=0;i<22;i++){
  const m=new THREE.SpriteMaterial({map:glow,color:nebCols[i%4],transparent:true,opacity:.12,blending:THREE.AdditiveBlending,depthWrite:false});
  const s=new THREE.Sprite(m);
  const r=150+Math.random()*1000,a=Math.random()*Math.PI*2;
  s.position.set(Math.cos(a)*r,(Math.random()-.5)*120,Math.sin(a)*r);
  const sc=400+Math.random()*600;s.scale.set(sc,sc,1);
  nebula.add(s);
}
galaxy.add(nebula);

// далёкие звёзды (не вращаются вместе с диском)
const bp=[],bc=[];
for(let i=0;i<5000;i++){
  const v=new THREE.Vector3().randomDirection().multiplyScalar(2500+Math.random()*2500);
  bp.push(v.x,v.y,v.z);
  const k=.5+Math.random()*.5;
  bc.push(k,k*(.7+Math.random()*.3),1);
}
const bgStars=points(bp,bc,9,.9);
scene.add(bgStars);

// ---------- сердце из светящихся частиц ----------
const heart=new THREE.Group();
const hp=[],hc=[];
const hA=new THREE.Color(0xff2e8a),hB=new THREE.Color(0xffb3e6);
const HS=15; // масштаб сердца
for(let i=0;i<9000;i++){
  const t=Math.random()*Math.PI*2;
  const x=16*Math.pow(Math.sin(t),3);
  const y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  const edge=i<3500;                       // первые 3500 точек — яркий контур
  const k=edge?1-Math.random()*.04:Math.pow(Math.random(),.5)*.96;
  hp.push(x*k*HS,y*k*HS+15,(Math.random()-.5)*(edge?30:80)*(1-k*k*.5));
  const c=edge?new THREE.Color(0xffffff).lerp(hB,Math.random()*.5):hA.clone().lerp(hB,Math.random()*.6);
  hc.push(c.r,c.g,c.b);
}
const heartPts=points(hp,hc,14,1);
heartPts.renderOrder=10;
heart.add(heartPts);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color:0xff2ea6,transparent:true,opacity:.35,blending:THREE.AdditiveBlending,depthWrite:false}));
halo.scale.set(800,800,1);halo.renderOrder=9;heart.add(halo);
scene.add(heart);

// ---------- фотографии ----------
const loader=new THREE.TextureLoader();
const photos=[];
function placeholder(i){
  const c=document.createElement('canvas');c.width=400;c.height=500;
  const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,400,500);
  g.addColorStop(0,'#ff4fc3');g.addColorStop(1,'#6a5cff');
  x.fillStyle=g;x.fillRect(0,0,400,500);
  x.font='160px Arial';x.textAlign='center';x.fillText('💖',200,290);
  x.font='bold 40px Arial';x.fillStyle='#fff';x.fillText('фото '+i,200,400);
  return new THREE.CanvasTexture(c);
}
const PHOTO_LIST=(typeof PHOTOS!=='undefined'&&Array.isArray(PHOTOS))?PHOTOS:[];
const PN=PHOTO_LIST.length;
const PS=Math.max(100,160-PN*1.8);          // размер фото: чем больше фото, тем чуть меньше
const R_MIN=380,R_MAX=700+Math.sqrt(PN)*60; // кольцо галактики, где лежат фото
const GOLD=Math.PI*(3-Math.sqrt(5));
function fitPhoto(g,w,h){                  // вписать фото в рамку без искажений
  const k=Math.min(PS*.82/w,PS/h),pw=w*k,ph=h*k;
  g.userData.pic.scale.set(pw,ph,1);
  g.userData.frame.scale.set(pw+10,ph+10,1);
  g.userData.aura.scale.set(pw*2.4,ph*2.4,1);
}
PHOTO_LIST.forEach((file,i)=>{
  const grp=new THREE.Group();
  const frame=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({color:0xffffff}));
  const mat=new THREE.MeshBasicMaterial({color:0xffffff});
  const pic=new THREE.Mesh(new THREE.PlaneGeometry(1,1),mat);
  pic.position.z=.5;
  const aura=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color:0xff4fc3,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));
  aura.position.z=-2;
  grp.add(aura,frame,pic);
  // равномерная «подсолнечная» раскладка по диску галактики — без наложений
  const rad=R_MIN+(R_MAX-R_MIN)*Math.sqrt((i+.5)/PN),th=i*GOLD;
  grp.userData={pic,frame,aura,rad,th,ph:Math.random()*6.28};
  fitPhoto(grp,80,100);
  loader.load(file,t=>{t.colorSpace=THREE.SRGBColorSpace;mat.map=t;mat.needsUpdate=true;fitPhoto(grp,t.image.width,t.image.height)},undefined,()=>{mat.map=placeholder(i+1);mat.needsUpdate=true});
  galaxy.add(grp);
  photos.push(grp);
});

// ---------- стикеры ----------
const icons=["💖","💕","💘","💝","💗","💓","💞","💜","🌹","🌸","🌺","🌷","🦋","✨","🌟","⭐","🎀","🍓","🍒","🥰","😍","😘","🐻","🐰","🌈"];
const emojiTex={};
function emojiTexture(e){
  if(emojiTex[e])return emojiTex[e];
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d');
  x.font='96px Arial';x.textAlign='center';x.textBaseline='middle';
  x.fillText(e,64,70);
  return emojiTex[e]=new THREE.CanvasTexture(c);
}
const stickers=[];
for(let i=0;i<90;i++){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:emojiTexture(icons[Math.random()*icons.length|0]),transparent:true,depthWrite:false}));
  const r=420+Math.random()*850,a=Math.random()*Math.PI*2;
  s.position.set(Math.cos(a)*r,(Math.random()-.5)*450,Math.sin(a)*r);
  const sc=22+Math.random()*22;s.scale.set(sc,sc,1);
  s.userData={y:s.position.y,ph:Math.random()*Math.PI*2,sp:.5+Math.random()};
  galaxy.add(s);stickers.push(s);
}

// ---------- управление с инерцией ----------
let vx=0,vy=0,dragging=false,lastX=0,lastY=0,lastDist=0,idle=0;
let targetZ=2400,started=false;
const clampZ=z=>Math.max(300,Math.min(4000,z));

addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;dragging=true;lastX=e.clientX;lastY=e.clientY;});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{
  if(!dragging||e.pointerType==='touch')return;
  vy=(e.clientX-lastX)*.0045;vx=(e.clientY-lastY)*.0045;
  lastX=e.clientX;lastY=e.clientY;idle=0;
});
addEventListener('touchstart',e=>{
  if(e.touches.length===1){lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
},{passive:true});
addEventListener('touchmove',e=>{
  e.preventDefault();idle=0;
  if(e.touches.length===1){
    vy=(e.touches[0].clientX-lastX)*.0045;vx=(e.touches[0].clientY-lastY)*.0045;
    lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;
  }
},{passive:false});
['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault());
addEventListener('wheel',e=>{if(started)targetZ=clampZ(targetZ+e.deltaY*.6);idle=0;},{passive:true});

// ---------- кнопки приближения ----------
const ZOOM_STEP=300;
const zoomBox=document.getElementById('zoom');
['pointerdown','touchstart','touchmove'].forEach(n=>zoomBox.addEventListener(n,e=>e.stopPropagation(),{passive:true}));
document.getElementById('zoomIn').addEventListener('click',()=>{if(started){targetZ=clampZ(targetZ-ZOOM_STEP);idle=0;}});
document.getElementById('zoomOut').addEventListener('click',()=>{if(started){targetZ=clampZ(targetZ+ZOOM_STEP);idle=0;}});

// ---------- старт ----------
const music=document.getElementById('music');
function startGalaxy(){
  startEl.classList.add('hide');clearInterval(riseTimer);
  renderer.domElement.style.opacity=1;
  music.volume=.8;music.play().catch(()=>{});
  targetZ=1500;started=true;
  const h=document.getElementById('hint');
  zoomBox.classList.add('show');
  setTimeout(()=>h.classList.add('show'),1800);
  setTimeout(()=>h.classList.remove('show'),9000);
}

// ---------- анимация ----------
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();

  // плавный подлёт камеры
  camera.position.z+=(targetZ-camera.position.z)*(started?.022:0);
  camera.position.y+=((started?220:250)-camera.position.y)*.03;
  camera.lookAt(0,0,0);

  // вращение с инерцией + авто-вращение в покое
  idle+=1;
  galaxy.rotation.y+=vy+(idle>120||!started?.0012:0);
  galaxy.rotation.x=Math.max(-1.2,Math.min(1.2,galaxy.rotation.x+vx));
  if(!dragging){vx*=.94;vy*=.94;}else{vx*=.7;vy*=.7;}

  disk.rotation.y+=.0004;
  nebula.rotation.y-=.0002;
  bgStars.rotation.y+=.00008;

  // сердцебиение
  const beat=1+Math.pow(Math.max(0,Math.sin(t*2.6)),8)*.12+Math.sin(t*1.3)*.015;
  heart.scale.setScalar(beat);
  heart.rotation.y=Math.sin(t*.6)*.35;heart.position.y=Math.sin(t*.9)*8;
  halo.material.opacity=.3+Math.sin(t*2.6)*.08;

  // фото по орбите, лицом наружу
  const gInv=galaxy.quaternion.clone().invert().multiply(camera.quaternion);
  photos.forEach(p=>{
    const d=p.userData,a=d.th+t*.05;
    p.position.set(Math.cos(a)*d.rad,Math.sin(a*2+d.ph)*28+Math.sin(t*.8+d.ph)*10,Math.sin(a)*d.rad);
    p.quaternion.copy(gInv);               // фото всегда смотрят на камеру
  });

  // стикеры покачиваются
  stickers.forEach(s=>{s.position.y=s.userData.y+Math.sin(t*s.userData.sp+s.userData.ph)*14;});

  renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
